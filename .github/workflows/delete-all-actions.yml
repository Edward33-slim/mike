name: 🧹 Delete All Actions Runs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all previous workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          while true; do
            runs="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$REPO/actions/runs?per_page=100&page=1")"

            ids="$(echo "$runs" | jq -r --arg current "$CURRENT_RUN_ID" '.workflow_runs[].id | tostring | select(. != $current)')"

            if [ -z "$ids" ]; then
              echo "No previous workflow runs remain."
              break
            fi

            for run_id in $ids; do
              echo "Deleting workflow run: $run_id"
              curl -fsSL -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/$REPO/actions/runs/$run_id"
            done
          done

      - name: Delete this temporary workflow file
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          sha="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$REPO/contents/.github/workflows/delete-all-actions.yml" \
            | jq -r '.sha')"

          curl -fsSL -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$REPO/contents/.github/workflows/delete-all-actions.yml" \
            -d "$(jq -n --arg message "Remove temporary Actions cleanup workflow" --arg sha "$sha" '{message:$message,sha:$sha}')"

          echo "Temporary cleanup workflow deleted."
