name: 🧹 Delete All Actions Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all Actions workflow runs except this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          while true; do
            runs="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs?per_page=100&page=1")"

            ids="$(echo "$runs" | jq -r --arg current "$CURRENT_RUN_ID" '.workflow_runs[].id | tostring | select(. != $current)')"

            if [ -z "$ids" ]; then
              echo "All previous Actions runs have been deleted."
              break
            fi

            for run_id in $ids; do
              echo "Deleting Actions run: $run_id"

              curl -fsSL -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/actions/runs/$run_id"

              echo "Deleted: $run_id"
            done
          done
